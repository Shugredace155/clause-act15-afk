<!doctype html>
<html lang="en">
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Clause — Act 1.5 Fracture (AFK web)</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; font-family: ui-sans-serif, system-ui, sans-serif; background:#14141a; color:#eee; }
  #wrap { max-width: 820px; margin: 0 auto; min-height: 100vh; display:flex; flex-direction:column; padding: 24px; box-sizing:border-box; }
  #stage { flex:1; background:#2b2b34; border-radius:12px; padding:24px; display:flex; flex-direction:column; justify-content:flex-end; gap:12px; }
  #cast { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:auto; }
  .spr { width:70px; height:140px; border-radius:8px; opacity:.9; display:flex; align-items:flex-end; justify-content:center; font-size:11px; padding:4px; box-sizing:border-box; }
  #speaker { font-weight:700; letter-spacing:.02em; min-height:1.2em; }
  #line { font-size:1.15rem; line-height:1.45; min-height:3.2em; }
  #hud { display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
  button { background:#1a1a22; color:#eee; border:1px solid #444; border-radius:8px; padding:10px 14px; cursor:pointer; text-align:left; }
  button:hover { border-color:#888; }
  #choices { display:flex; flex-direction:column; gap:8px; }
  #meta { opacity:.6; font-size:12px; margin-top:12px; }
  dialog { border:none; border-radius:12px; background:#1a1a22; color:#eee; max-width:520px; padding:20px; }
  dialog::backdrop { background: rgba(0,0,0,.55); }
</style>
<body>
<div id="wrap">
  <div id="hud">
    <button type="button" id="btnLease">Lease</button>
    <button type="button" id="btnNapkin">House Clause</button>
    <button type="button" id="btnCal">Calendar</button>
  </div>
  <div id="stage">
    <div id="cast"></div>
    <div id="speaker"></div>
    <div id="line"></div>
    <div id="choices"></div>
  </div>
  <div id="meta">Clause Act 1.5 Fracture · tip 9d301674 · PR #18</div>
</div>
<dialog id="panel"><div id="panelBody"></div><form method="dialog"><button>Close</button></form></dialog>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
const COLORS = {"Jordan":"#a8e6a1","Riley":"#7ec8e3","Sam":"#f0a7a0","Alex":"#f5d76e","You":"#e8d5ff"};
PLACEHOLDER_NODES
const castEl = document.getElementById('cast');
const speakerEl = document.getElementById('speaker');
const lineEl = document.getElementById('line');
const choicesEl = document.getElementById('choices');
const panel = document.getElementById('panel');
const panelBody = document.getElementById('panelBody');
function showCast() {
  const names = ["Riley","Jordan","Sam","Alex"];
  castEl.innerHTML = names.map(n => `<div class="spr" style="background:${COLORS[n]}33;border:1px solid ${COLORS[n]}99">${n}</div>`).join('');
}
function go(id) {
  const n = NODES[id];
  if (!n) { lineEl.textContent = '(missing node) '+id; return; }
  if (n.type === 'goto') return go(n.to);
  choicesEl.innerHTML = '';
  if (n.type === 'end') { speakerEl.textContent = ''; lineEl.textContent = n.text; return; }
  if (n.type === 'choice') {
    speakerEl.textContent = '';
    lineEl.textContent = n.prompt || '';
    n.options.forEach(o => {
      const b = document.createElement('button');
      b.textContent = o.text;
      b.onclick = () => go(o.to);
      choicesEl.appendChild(b);
    });
    return;
  }
  showCast();
  const sp = n.speaker || '';
  speakerEl.style.color = COLORS[sp] || '#eee';
  speakerEl.textContent = sp;
  lineEl.textContent = n.text;
  const cont = document.createElement('button');
  cont.textContent = 'Continue';
  cont.onclick = () => go(n.next);
  choicesEl.appendChild(cont);
}
document.getElementById('btnLease').onclick = () => {
  panelBody.innerHTML = '<h3>LEASE</h3><p>Fracture chunk. Priority may be lease — rent, shifts, Lit.</p>';
  panel.showModal();
};
document.getElementById('btnNapkin').onclick = () => {
  panelBody.innerHTML = '<h3>HOUSE CLAUSE</h3><ol><li>No dating roommates</li><li>Quiet hours 11–7</li><li>Chores rotate</li><li>Rent before the 5th</li><li>Break → meet within 48h</li></ol>';
  panel.showModal();
};
document.getElementById('btnCal').onclick = () => {
  panelBody.innerHTML = '<h3>CALENDAR</h3><p>Act 1.5 — Fracture</p><p>House meeting / vote / priority / gate arm</p>';
  panel.showModal();
};
go('start');
</script>
</body>
</html>
